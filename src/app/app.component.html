<!-- Tela de login: sem sidebar, somente o router-outlet -->
@if (!isLoggedIn()) {
  <router-outlet />
}

<!-- App autenticado: sidebar + conteúdo -->
@if (isLoggedIn()) {
  <div class="app-shell">

    <!-- ── SIDEBAR ──────────────────────────────────────────────────────── -->
    <aside class="sidebar">

      <!-- Logo -->
      <div class="sidebar-brand" (click)="navegarPara('/nova-pauta')">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 32 32" fill="none">
            <rect width="32" height="32" rx="8" fill="white" fill-opacity="0.15"/>
            <path d="M8 10h16M8 16h10M8 22h13" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
            <circle cx="24" cy="22" r="3.5" fill="#6EE7B7"/>
          </svg>
        </div>
        <span class="brand-label">Pauta<em>App</em></span>
      </div>

      <p-divider styleClass="sidebar-divider" />

      <!-- Navegação -->
      <nav class="sidebar-nav">
        @for (item of navItems; track item.route) {
          <button
            class="nav-item"
            [class.active]="isAtivo(item.route)"
            (click)="navegarPara(item.route)"
            [pTooltip]="item.tooltip"
            tooltipPosition="right"
          >
            <i [class]="item.icon"></i>
            <span>{{ item.label }}</span>
          </button>
        }
      </nav>

      <!-- Rodapé da sidebar: avatar + sair -->
      <div class="sidebar-footer">
        <p-divider styleClass="sidebar-divider" />

        <div class="user-info">
          @if (userFotoUrl()) {
            <p-avatar
              [image]="userFotoUrl()!"
              shape="circle"
              size="normal"
            />
          } @else {
            <p-avatar
              [label]="userIniciais()"
              shape="circle"
              size="normal"
              styleClass="avatar-fallback"
            />
          }
          <span class="user-nome">{{ userNome() }}</span>
        </div>

        <button
          class="btn-sair"
          (click)="sair()"
          pTooltip="Sair"
          tooltipPosition="right"
        >
          <i class="pi pi-sign-out"></i>
        </button>
      </div>

    </aside>

    <!-- ── CONTEÚDO PRINCIPAL ───────────────────────────────────────────── -->
    <main class="main-content">
      <router-outlet />
    </main>

  </div>
}
